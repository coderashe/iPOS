<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Dashboard</h1>
  </div>

  <app-date-range-picker (rangeChange)="onDateRangeChange()"></app-date-range-picker>
  
  <app-device-filter (deviceChange)="onDeviceChange($event)"></app-device-filter>

  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Loading dashboard data...</p>
  </div>

  <div *ngIf="error" class="error-message">
    <span class="error-icon">⚠️</span>
    <p>{{ error }}</p>
  </div>

  <div *ngIf="summary && !loading" class="dashboard-content">
    <div class="summary-cards-grid">
      <app-summary-card
        *ngFor="let card of summaryCards"
        [title]="card.title"
        [value]="card.value"
        [icon]="card.icon"
        [format]="card.format"
      ></app-summary-card>
    </div>

    <div class="top-products-section">
      <h2>Top Products</h2>
      <div class="table-container">
        <table class="products-table">
          <thead>
            <tr>
              <th>Product</th>
              <th>Quantity Sold</th>
              <th>Revenue</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let product of summary.topProducts">
              <td>{{ product.productName }}</td>
              <td>{{ product.quantitySold }}</td>
              <td>{{ product.revenue | currency }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="last-sync">
      <small>Last synced: {{ summary.lastSyncTime | date:'medium' }}</small>
    </div>
  </div>
</div>
