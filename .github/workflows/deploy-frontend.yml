name: Deploy Angular Dashboard to GitHub Pages

on:
  push:
    branches:
      - feature/frontend-github-pages
    paths:
      - 'frontend/ipos-dashboard/**'
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ipos-dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/ipos-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (static, base-href /iPOS/)
        run: npm run build:gh-pages

      - name: Copy 404.html for SPA routing
        run: cp dist/ipos-dashboard/browser/index.html dist/ipos-dashboard/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/ipos-dashboard/dist/ipos-dashboard/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
