name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  build-and-deploy-frontend:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Angular dependencies
        shell: cmd
        working-directory: frontend/ipos-dashboard
        run: npm install --legacy-peer-deps

      - name: Build Angular app
        shell: cmd
        working-directory: frontend/ipos-dashboard
        run: npm run build -- --configuration production

      - name: Deploy Frontend to IIS
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
        run: |
          $appcmd = "$env:SystemRoot\system32\inetsrv\appcmd.exe"
          $dest = "C:\inetpub\wwwroot\ipos-dashboard"

          # Stop app pool to release file locks
          & $appcmd stop apppool /apppool.name:"ipos-dashboard" | Out-Null
          Start-Sleep -Seconds 5

          # Clear contents without deleting the folder (avoids permission issues on folder itself)
          if (Test-Path $dest) {
            Remove-Item "$dest\*" -Recurse -Force
          }

          # Copy new files
          robocopy ".\frontend\ipos-dashboard\dist\ipos-dashboard\browser" $dest /E /IS /IT /R:2 /W:3
          if ($LASTEXITCODE -le 7) { $LASTEXITCODE = 0 }

          # Recycle app pool
          & $appcmd start apppool /apppool.name:"ipos-dashboard" | Out-Null
