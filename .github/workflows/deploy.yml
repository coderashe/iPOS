name: CI/CD iPOS to IIS

on:
  push:
    branches:
      - feature/analytics-dashboard

jobs:
  build-backend:
    runs-on: self-hosted
    env:
      DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Verify .NET
        shell: cmd
        run: dotnet --version

      - name: Restore & Publish iPOS API
        shell: cmd
        run: |
          dotnet restore backend/iPosApi.csproj
          dotnet publish backend/iPosApi.csproj -c Release -o ./publish/backend

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipos-backend
          path: ./publish/backend

  # build-frontend:
