name: CI/CD iPOS to IIS
# updated secret: DB_CONNECTION_STRING

on:
  push:
    branches:
      - main

jobs:
  build-backend:
    runs-on: self-hosted
    env:
      DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify .NET
        shell: cmd
        run: dotnet --version

      - name: Restore & Publish iPOS API
        shell: cmd
        run: |
          dotnet restore backend/iPosApi.csproj
          dotnet publish backend/iPosApi.csproj -c Release -o ./publish/backend

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipos-backend
          path: ./publish/backend

  build-frontend:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Angular dependencies
        shell: cmd
        working-directory: frontend/ipos-dashboard
        run: npm install --legacy-peer-deps

      - name: Build Angular app
        shell: cmd
        working-directory: frontend/ipos-dashboard
        run: npm run build -- --configuration production

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipos-dashboard
          path: frontend/ipos-dashboard/dist/ipos-dashboard/browser

  deploy:
    runs-on: self-hosted
    needs: [build-backend, build-frontend]

    steps:
      - name: Download iPOS Backend
        uses: actions/download-artifact@v4
        with:
          name: ipos-backend
          path: ${{ runner.temp }}\ipos-backend

      - name: Deploy Backend to IIS folder
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
        run: |
          $appcmd = "$env:SystemRoot\system32\inetsrv\appcmd.exe"
          & $appcmd stop apppool /apppool.name:"iPosApi" | Out-Null
          & $appcmd stop site /site.name:"iPosApi" | Out-Null
          Start-Sleep -Seconds 5
          if (!(Test-Path "C:\inetpub\wwwroot\iPosApi")) { New-Item -ItemType Directory -Path "C:\inetpub\wwwroot\iPosApi" }
          robocopy "${{ runner.temp }}\ipos-backend" "C:\inetpub\wwwroot\iPosApi" /E /IS /IT /PURGE /R:2 /W:5
          if ($LASTEXITCODE -le 7) { $LASTEXITCODE = 0 }
          & $appcmd start site /site.name:"iPosApi" | Out-Null
          & $appcmd start apppool /apppool.name:"iPosApi" | Out-Null

      - name: Inject DB Connection String into backend appsettings
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
        run: |
          $path = 'C:\inetpub\wwwroot\iPosApi\appsettings.json'
          $json = Get-Content $path | ConvertFrom-Json
          $json.ConnectionStrings.DefaultConnection = '${{ secrets.DB_CONNECTION_STRING }}'
          $json | ConvertTo-Json -Depth 10 | Set-Content $path

      - name: Download Angular Dashboard
        uses: actions/download-artifact@v4
        with:
          name: ipos-dashboard
          path: ${{ runner.temp }}\ipos-dashboard

      - name: Deploy Dashboard to IIS folder
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
        run: |
          $appcmd = "$env:SystemRoot\system32\inetsrv\appcmd.exe"
          & $appcmd stop apppool /apppool.name:"ipos-dashboard" | Out-Null
          Start-Sleep -Seconds 3
          if (!(Test-Path "C:\inetpub\wwwroot\ipos-dashboard")) { New-Item -ItemType Directory -Path "C:\inetpub\wwwroot\ipos-dashboard" }
          robocopy "${{ runner.temp }}\ipos-dashboard" "C:\inetpub\wwwroot\ipos-dashboard" /E /IS /IT /PURGE
          if ($LASTEXITCODE -le 7) { $LASTEXITCODE = 0 }
          & $appcmd start apppool /apppool.name:"ipos-dashboard" | Out-Null
