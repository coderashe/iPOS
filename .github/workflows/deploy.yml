  deploy:
    runs-on: self-hosted
    needs: [build-backend]

    steps:
      - name: Download iPOS Backend
        uses: actions/download-artifact@v4
        with:
          name: ipos-backend
          path: ${{ runner.temp }}\ipos-backend

      - name: Download Angular Dashboard
        uses: actions/download-artifact@v4
        with:
          name: ipos-dashboard
          path: ${{ runner.temp }}\ipos-dashboard

      - name: Deploy Backend to IIS folder
        shell: powershell
        run: |
          Stop-WebAppPool -Name "iPosApi" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (!(Test-Path "C:\inetpub\wwwroot\iPosApi")) { New-Item -ItemType Directory -Path "C:\inetpub\wwwroot\iPosApi" }
          robocopy "${{ runner.temp }}\ipos-backend" "C:\inetpub\wwwroot\iPosApi" /E /IS /IT /PURGE
          if ($LASTEXITCODE -le 7) { $LASTEXITCODE = 0 }
          Start-WebAppPool -Name "iPosApi"

      - name: Deploy Dashboard to IIS folder
        shell: powershell
        run: |
          Stop-WebAppPool -Name "ipos-dashboard" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (!(Test-Path "C:\inetpub\wwwroot\ipos-dashboard")) { New-Item -ItemType Directory -Path "C:\inetpub\wwwroot\ipos-dashboard" }
          robocopy "${{ runner.temp }}\ipos-dashboard" "C:\inetpub\wwwroot\ipos-dashboard" /E /IS /IT /PURGE
          if ($LASTEXITCODE -le 7) { $LASTEXITCODE = 0 }
          Start-WebAppPool -Name "ipos-dashboard"

      - name: Inject DB Connection String into backend appsettings
        shell: powershell
        run: |
          $path = 'C:\inetpub\wwwroot\iPosApi\appsettings.json'
          $json = Get-Content $path | ConvertFrom-Json
          $json.ConnectionStrings.DefaultConnection = '${{ secrets.DB_CONNECTION_STRING }}'
          $json | ConvertTo-Json -Depth 10 | Set-Content $path
