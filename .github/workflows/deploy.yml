name: CI/CD iPOS to IIS

on:
  push:
    branches:
      - feature/analytics-dashboard

jobs:
  build-backend:
    runs-on: self-hosted
    env:
      DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify .NET
        shell: cmd
        run: dotnet --version

      - name: Restore & Publish iPOS API
        shell: cmd
        run: |
          dotnet restore backend/iPosApi.csproj
          dotnet publish backend/iPosApi.csproj -c Release -o ./publish/backend

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipos-backend
          path: ./publish/backend

  build-frontend:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Angular dependencies
        working-directory: frontend/ipos-dashboard
        run: npm install --legacy-peer-deps

      - name: Build Angular app
        working-directory: frontend/ipos-dashboard
        run: npm run build -- --configuration production

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipos-dashboard
          path: frontend/ipos-dashboard/dist/ipos-dashboard/browser

  deploy:
    runs-on: self-hosted
    needs: [build-backend, build-frontend]

    steps:
      - name: Download iPOS Backend
        uses: actions/download-artifact@v4
        with:
          name: ipos-backend
          path: C:\inetpub\wwwroot\iPosApi

      - name: Download Angular Dashboard
        uses: actions/download-artifact@v4
        with:
          name: ipos-dashboard
          path: C:\inetpub\wwwroot\ipos-dashboard

      - name: Inject DB Connection String into backend appsettings
        shell: cmd
        run: |
          powershell -ExecutionPolicy Bypass -Command "$path = 'C:\inetpub\wwwroot\iPosApi\appsettings.json'; $json = Get-Content $path | ConvertFrom-Json; $json.ConnectionStrings.DefaultConnection = '${{ secrets.DB_CONNECTION_STRING }}'; $json | ConvertTo-Json -Depth 10 | Set-Content $path"

      - name: Restart IIS
        continue-on-error: true
        shell: cmd
        run: iisreset /restart || echo "IIS restart attempted"
